name: Publish to npm

# Publishes packages/agentchannel when a GitHub release is published, as an
# npm trusted publisher (OIDC; configured on npmjs.com for this repo and this
# file). The release tag must match the package version (v2.0.0-rc.2 for 2.0.0-rc.2).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/agentchannel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      # trusted publishing (OIDC) needs npm 11.5.1 or newer; no token is stored anywhere
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # a prerelease version needs an explicit tag; this line is the only one in use, so it is latest
      - run: npm publish --provenance --access public --tag latest
