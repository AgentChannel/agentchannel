name: Publish to npm

# Publishes packages/agentchannel when a GitHub release is published. The
# release tag must match the package version (v2.0.0-rc.1 for 2.0.0-rc.1).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/agentchannel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm ci
      - run: npm run build
      # a prerelease version needs an explicit tag; this line is the only one in use, so it is latest
      - run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
